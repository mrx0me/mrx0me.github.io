---
layout: default
---

<link rel="stylesheet" href="{{ '/assets/css/monokai.css' | relative_url }}">
<div class="container mx-auto">
  <div id="post" class="prose md:prose-lg dark:prose-invert prose-img:rounded-lg max-w-[75ch] mx-auto pb-10 pt-20 lg:pt-[90px] lg:pb-20">
    <div class="pb-4" data-motion="fadeInRight">
        {{ ctf.categories[0] | upcase }}
    </div>

    <h1 class="text-left text-2xl font-bold md:text-5xl text-neutral-900 dark:text-neutral-100" data-motion="fadeInRight">{{ctf.title}}</h1>
    
    {% if ctf.image %}
      <img data-motion="fadeInUp" data-motion-onscroll="false" data-motion-delay="0.8" data-motion-duration="0.2" class="w-full" src="{{ctf.image | relative_url}}" alt="{{ctf.title}}">
    {% endif %}

    <div data-motion="fadeInUp" data-motion-onscroll="false" data-motion-delay="1" data-motion-duration="0.2" class="my-6">
      {{content}}
    </div>

    <div class="font-mulish flex justify-center mb-10">
      {% if ctf.previous.url %}
      <a class="pr-2" href="{{ctf.previous.url | relative_url}}">&laquo; {{ ctf.previous.title }}</a>
      {% endif %}
      {% if ctf.next.url %}
      <a class="pl-2" href="{{ctf.next.url | relative_url}}">{{ ctf.next.title }} &raquo;</a>
      {% endif %}
    </div>

  </div>
</div>
