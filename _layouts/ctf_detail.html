---
layout: default
---
<link rel="stylesheet" href="{{ '/assets/css/monokai.css' | relative_url }}">
<div class="container mx-auto">
  <div id="post" class="prose md:prose-lg dark:prose-invert prose-img:rounded-lg max-w-[75ch] mx-auto pb-10 pt-20 lg:pt-[90px] lg:pb-20">
    <div class="pb-4 font-mulish text-sm text-neutral-700 dark:text-neutral-300">
      {{ page.category | upcase }}
    </div>
    <h1 class="text-left text-2xl font-bold md:text-5xl text-neutral-900 dark:text-neutral-100">{{ page.title }}</h1>
    {% if page.image %}
      <img class="w-full" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    {% endif %}
    <div class="my-6">{{ content }}</div>
  </div>
</div>
